# Included in every server block that proxies to Homarr. Homarr's MCP
# endpoint, its OAuth routes and the page that approves MCP clients act with
# the caller's full permissions and can't be switched off in Homarr itself,
# so this host never serves them. nginx decodes %XX and merges slashes before
# matching; the regexes also catch case variants and the locale prefix
# (/en/auth/mcp).
location ^~ /api/mcp { return 404; }
location ^~ /.well-known/ { return 404; }
location ~* ^/+(api/+mcp|\.well-known/) { return 404; }
location ~* ^/+([^/]+/+)?auth/+mcp(/|$) { return 404; }
