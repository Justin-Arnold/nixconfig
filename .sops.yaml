creation_rules:
  - path_regex: ^secrets/hosts/lab118-services\.ya?ml$
    key_groups:
      - age: *lab118_services_recipients
  - path_regex: ^secrets/hosts/dashboard\.ya?ml$
    key_groups:
      - age: *dashboard_recipients
  - path_regex: ^secrets/hosts/agents\.ya?ml$
    key_groups:
      - age: *agents_recipients
  - path_regex: ^secrets/hosts/workbench\.ya?ml$
    key_groups:
      - age: *workbench_recipients
  - path_regex: ^secrets/hosts/openclaw\.ya?ml$
    key_groups:
      - age: *openclaw_recipients
  - path_regex: ^secrets/hosts/inference\.ya?ml$
    key_groups:
      - age: *inference_recipients
  - path_regex: ^secrets/hosts/automation\.ya?ml$
    key_groups:
      - age: *automation_recipients
  - path_regex: ^secrets/hosts/cglt-previews\.ya?ml$
    key_groups:
      - age: *cglt_previews_recipients
  - path_regex: ^secrets/.*\.ya?ml$
    key_groups:
      - age: *age_recipients
