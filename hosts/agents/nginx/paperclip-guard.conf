# Included in every server block that proxies to Paperclip.
#
# /mcp/paperclip is Paperclip's experimental MCP endpoint for outside
# assistants acting as a signed-in person, with OAuth discovery under
# /.well-known/. It's off in Paperclip; this keeps it unreachable even if it
# gets switched on.
#
# /api/routine-triggers/public/ is where routine webhooks fire. A trigger can
# be created with no authentication at all, so nothing reaches it here. The
# one server block made for a sender, paperclip-triggers.servicestack.xyz for
# n8n on the automation VM, doesn't include this file (endpoints.nix).
#
# nginx decodes %XX and merges slashes before matching; the regexes also catch
# case variants.
location = /mcp { return 404; }
location ^~ /mcp/ { return 404; }
location ^~ /.well-known/ { return 404; }
location ^~ /api/routine-triggers/public/ { return 404; }
location ~* ^/+(mcp(/|$)|\.well-known/|api/+routine-triggers/+public/) { return 404; }
