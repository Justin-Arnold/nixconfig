# Gneiss for Alacritty. The colors are Gneiss's base color names in double
# braces, filled in from palette.toml.

[colors.primary]
background = "{{gneiss0}}"
foreground = "{{gneiss4}}"

[colors.cursor]
cursor = "{{gneiss4}}"
text = "{{gneiss0}}"

# The same gray as a selection in VS Code; the text keeps its own color.
[colors.selection]
background = "{{gneiss2}}"
text = "CellForeground"

[colors.normal]
black = "{{gneiss1}}"
red = "{{gneiss11}}"
green = "{{gneiss14}}"
yellow = "{{gneiss13}}"
blue = "{{gneiss9}}"
magenta = "{{gneiss15}}"
cyan = "{{gneiss8}}"
white = "{{gneiss5}}"

# Bright black is what terminal programs dim text with. Nord uses its border
# gray, at 1.7:1 too faint to read; Gneiss uses its comment gray (3.3:1).
[colors.bright]
black = "{{gneiss-comment}}"
red = "{{gneiss11}}"
green = "{{gneiss14}}"
yellow = "{{gneiss13}}"
blue = "{{gneiss9}}"
magenta = "{{gneiss15}}"
cyan = "{{gneiss7}}"
white = "{{gneiss6}}"
