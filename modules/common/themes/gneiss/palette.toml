# Gneiss: Nord's colors on neutral dark grays. Pronounced "nice", after
# the gray Nordic bedrock.
#
# Gneiss is its own theme. Its colors started as Nord's (nordtheme.com),
# copied once and owned here: nothing follows Nord, so a change to Nord
# doesn't change Gneiss. The four background grays and the comment gray
# are neutral where Nord's are blue-gray, and keep Nord's steps between
# them: 1.24, 1.45 and 1.69 to 1 against the background, as nord1 to nord3
# are against nord0. The text and accent colors are Nord's values.

[meta]
name = "Gneiss"
# The version of the ports built here. VS Code's keeps its own, in its
# package.json.
version = "0.1.0"

# The base colors, numbered like Nord's so each port can be compared with
# Nord's. Ports name them in double braces, such as {{gneiss0}}.
[base]
# Backgrounds, darkest first (Nord's Polar Night: #2E3440 to #4C566A)
gneiss0 = "#1C1C1C"          # editor and window background
gneiss1 = "#2D2D2D"          # panels, status bars, the current line
gneiss2 = "#383838"          # selection, raised controls
gneiss3 = "#424242"          # borders, indent guides
gneiss-comment = "#6E6E6E"   # comments: Nord's #616E88 at the same lightness

# Text, brightest last
gneiss4 = "#D8DEE9"          # body text
gneiss5 = "#E5E9F0"
gneiss6 = "#ECEFF4"          # punctuation, emphasis

# Cool accents, which carry most of the syntax
gneiss7 = "#8FBCBB"          # attribute names, types
gneiss8 = "#88C0D0"          # functions; the main accent
gneiss9 = "#81A1C1"          # keywords, operators
gneiss10 = "#5E81AC"         # deep blue, for hints

# Warm accents, kept for meaning
gneiss11 = "#BF616A"         # errors, deletions
gneiss12 = "#D08770"         # used sparingly
gneiss13 = "#EBCB8B"         # warnings
gneiss14 = "#A3BE8C"         # strings, additions
gneiss15 = "#B48EAD"         # numbers

# The roles every theme here has (see ../default.nix), for apps themed from
# raw colors. A value names a base color, or is a hex of Gneiss's own.
[colors]
bg = "gneiss0"
bg-subtle = "gneiss1"
surface = "gneiss1"
overlay = "gneiss1"
elevated = "gneiss2"
selection = "gneiss2"
border = "gneiss3"
border-strong = "gneiss-comment"

fg = "gneiss4"
fg-muted = "#A2A2A2"         # not in Nord: the darkest gray at 4.5:1 on gneiss2
fg-faint = "gneiss-comment"
cursor = "gneiss4"

accent = "gneiss8"
on-accent = "gneiss0"

blue = "gneiss9"
green = "gneiss14"
red = "gneiss11"
yellow = "gneiss13"
magenta = "gneiss15"
cyan = "gneiss8"
blue-bright = "gneiss9"
green-bright = "gneiss14"
red-bright = "gneiss11"
yellow-bright = "gneiss13"
magenta-bright = "gneiss15"
cyan-bright = "gneiss7"
